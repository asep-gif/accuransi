<style>
/* Layout: sticky ledger header (identity + health chips + tabs), then one working sheet per tab; wide tables scroll inside their own frame. */
:root{
  --paper:#f3f5f2; --sheet:#ffffff; --ink:#18211d; --muted:#5c6963; --rule:#dce2de; --rule-strong:#b9c3be;
  --accent:#1d6a57; --accent-ink:#ffffff; --accent-soft:#e2efe9; --band:#f7f9f7; --sub:#eef2ef;
  --tp21:#1f63b5; --tp23:#7a3fb0; --tp42:#0f7a78;
  --ok:#2c7a4b; --ok-soft:#e1f1e6; --warn:#9a6513; --warn-soft:#f8eed9; --bad:#b03a28; --bad-soft:#f8e3de;
  --neg:#a2382a;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111614; --sheet:#181e1b; --ink:#e3eae6; --muted:#97a59e; --rule:#29322e; --rule-strong:#3d4843;
  --accent:#62bf9f; --accent-ink:#0d1714; --accent-soft:#1c2f28; --band:#1c2320; --sub:#212925;
  --tp21:#7fb0f0; --tp23:#c39af0; --tp42:#5fcfc9;
  --ok:#6cc58f; --ok-soft:#18301f; --warn:#e2b257; --warn-soft:#33290f; --bad:#f08470; --bad-soft:#3a1d17; --neg:#f19a88;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111614; --sheet:#181e1b; --ink:#e3eae6; --muted:#97a59e; --rule:#29322e; --rule-strong:#3d4843;
  --accent:#62bf9f; --accent-ink:#0d1714; --accent-soft:#1c2f28; --band:#1c2320; --sub:#212925;
  --tp21:#7fb0f0; --tp23:#c39af0; --tp42:#5fcfc9;
  --ok:#6cc58f; --ok-soft:#18301f; --warn:#e2b257; --warn-soft:#33290f; --bad:#f08470; --bad-soft:#3a1d17; --neg:#f19a88;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule)}
.onb header.top,.onb main{display:none!important}
body.onb{background:#0d3a30;margin:0;padding:0}
.cv{min-height:100vh;color:#fff;background:radial-gradient(1200px 600px at 15% 10%,rgba(255,255,255,.10),transparent 60%),radial-gradient(900px 700px at 95% 100%,rgba(122,214,180,.22),transparent 60%),linear-gradient(140deg,#0b3229 0%,#145545 45%,#1f7a62 100%);padding:clamp(20px,4vw,48px) 16px 28px;display:flex}
.cv-in{max-width:1200px;margin:auto;width:100%;display:grid;gap:clamp(20px,4vw,48px);grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:center}
.cv-hero{min-width:0}
.cv-brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.04em;opacity:.95}
.cv h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.4vw,40px);line-height:1.08;margin:16px 0 10px;text-wrap:balance;max-width:22ch}
.cv-lede{color:rgba(255,255,255,.82);font-size:15px;line-height:1.55;max-width:56ch;margin:0}
.cv-btns{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 6px}
.cv-btn{display:inline-flex;align-items:center;gap:8px;color:#fff;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 16px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;backdrop-filter:blur(6px);transition:background .15s,border-color .15s}
.cv-solid{background:#fff;color:#0f4a3c;border-color:#fff;font-weight:600}.cv-solid:hover{background:#e9f7f1;border-color:#e9f7f1}
.cv-oss{font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:rgba(191,240,220,.18);border:1px solid rgba(191,240,220,.5);color:#d9f7ea}
.oss-meta{display:flex;flex-wrap:wrap;gap:10px 28px;margin:14px 0 6px;padding:10px 12px;background:var(--band);border:1px solid var(--rule);border-radius:8px}.oss-meta .label{display:block;margin-bottom:2px}
.oss-d{margin-top:8px;border:1px solid var(--rule);border-radius:8px;padding:8px 12px}.oss-d summary{cursor:pointer;font-weight:600;font-size:13.5px}
.oss-d pre{white-space:pre-wrap;font-family:var(--f-num);font-size:11.5px;line-height:1.5;margin:10px 0 0;max-height:240px;overflow:auto;color:var(--muted)}
.oss-t{width:100%;font-size:12.5px;margin-top:8px}.oss-t th,.oss-t td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--rule)}
.cv-btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.6)}.cv-btn:focus-visible{outline:2px solid #bff0dc;outline-offset:2px}
.cv-art{display:block;width:100%;max-width:560px;height:auto;margin:14px 0 6px}
.cv-pills{display:flex;flex-wrap:wrap;gap:6px}.cv-pills span{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.07);color:rgba(255,255,255,.9)}
.cv-card{background:var(--sheet);color:var(--ink);border-radius:16px;padding:clamp(18px,2.4vw,28px);box-shadow:0 24px 60px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.12);min-width:0}
.cv-card h2{font-family:var(--f-display);font-size:22px;margin:0;font-weight:700}
.cv-foot{grid-column:1/-1;text-align:center;font-size:12px;color:rgba(255,255,255,.7);margin:0;letter-spacing:.02em}
@media (prefers-reduced-motion:no-preference){.cv-f0{animation:cvf 7s ease-in-out infinite}.cv-f1{animation:cvf 6s ease-in-out infinite .6s}.cv-f2{animation:cvf 6.5s ease-in-out infinite 1.2s}.cv-f3{animation:cvf 7.5s ease-in-out infinite .3s}}
@keyframes cvf{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (max-width:900px){.cv-in{grid-template-columns:minmax(0,1fr)}.cv-art{max-width:460px;margin-inline:auto}}
@media (max-width:560px){.cv-art{display:none}.cv-pills{display:none}}
.wl-steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.wl-steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:2px 10px}
.wl-steps li::before{content:counter(s);grid-row:span 2;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;display:grid;place-items:center}
.wl-steps b{font-weight:600}.wl-steps span{color:var(--muted);font-size:13.5px}
.wl-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px;font-size:14px}.wl-list b{font-weight:600}
.wl-f{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.field .rq{color:var(--bad)}.field.bad input{border-color:var(--bad)}.ferr{color:var(--bad);font-size:11.5px;min-height:0}.ferr:empty{display:none}
label.btnlike{display:inline-flex;align-items:center;cursor:pointer;padding:7px 12px;border:1px solid var(--rule-strong);border-radius:6px;font-size:13px}
.idrow{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between;padding-block:14px 8px}
.idrow h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;margin:0;line-height:1.1}
.idrow .sub{color:var(--muted);font-size:13px;margin-top:3px}
.idrow .sub b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);background:var(--band);white-space:nowrap;cursor:default}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)} .chip.ok::before{background:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)} .chip.warn::before{background:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)} .chip.bad::before{background:var(--bad)}
button.chip{cursor:pointer;font:inherit;font-size:12px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.02em;color:var(--muted);text-decoration:none;padding:9px 12px 8px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a .n{font-family:var(--f-num);font-size:11px;font-weight:500;opacity:.7;margin-right:6px}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a:hover{color:var(--ink)}
main{padding-block:18px 60px}
section.panel{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
section.panel>*{min-width:0}
.rtbl{overflow-x:auto}
select{max-width:100%}
label.inline{flex-wrap:wrap;max-width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.bar .grow{flex:1 1 auto}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:15px;margin:0 0 8px;letter-spacing:.02em}
.lede{color:var(--muted);max-width:72ch;margin:4px 0 0}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:16px;min-width:0}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.file-name{font-weight:600;word-break:break-word}
.muted{color:var(--muted)} .small{font-size:12px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,.btn{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);padding:6px 12px;border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{border-color:transparent;background:transparent;padding:4px 6px;color:var(--muted)}
button.ghost:hover{color:var(--ink);background:var(--sub)}
button.danger{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule-strong);border-radius:4px;padding:5px 8px;min-width:0}
input[type=file]{font-size:12px;border:1px dashed var(--rule-strong);padding:8px;width:100%;background:var(--band)}
input.num{font-family:var(--f-num);text-align:right;width:130px;font-variant-numeric:tabular-nums}
label.inline{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.field{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.field input,.field select{width:100%}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.tblwrap{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--rule);border-radius:6px;background:var(--sheet)}
.tblwrap.free{max-height:none}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:5px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
thead th{position:sticky;top:0;background:var(--band);z-index:2;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
thead tr.two th{top:27px}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
td.n{font-size:12.5px}
td.neg{color:var(--neg)}
td.code{font-family:var(--f-num);font-size:12px;white-space:nowrap}
tr.grp td{background:var(--sub);font-weight:600}
tr.grp td.n{font-weight:600}
tr.sec td{background:var(--band);font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:12px}
tr.tot td{font-weight:600;border-top:1px solid var(--rule-strong)}
tr.grand td{font-weight:700;border-top:2px solid var(--ink);border-bottom:3px double var(--ink);background:var(--sheet)}
tr.det td:first-child{padding-left:26px}
tr.unm td{background:var(--warn-soft)}
th.adj,td.adj{background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
thead th.adj{background:var(--accent-soft);color:var(--accent)}
td.fin,th.fin{font-weight:600}
.indent1{padding-left:24px!important}.indent2{padding-left:40px!important}
.toggle{cursor:pointer;user-select:none}
.toggle .car{display:inline-block;width:12px;color:var(--muted);transition:transform .15s}
.toggle.open .car{transform:rotate(90deg)}
a.acct{color:var(--accent);text-decoration:none;cursor:pointer} a.acct:hover{text-decoration:underline}
.tp{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:3px;margin-left:4px;white-space:nowrap;cursor:help;border:1px solid transparent}
.tp21,.tpt21{--c:var(--tp21)} .tp23,.tpt23{--c:var(--tp23)} .tp42,.tpt42{--c:var(--tp42)}
.tp{color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border-color:color-mix(in srgb,var(--c) 35%,transparent)}
.tpk{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;flex-direction:column;gap:2px;max-width:520px;white-space:normal}
.tpk b{color:var(--c);font-weight:600;margin-right:4px}
.tplegend{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:0 0 8px}.tplegend .tp{margin-left:0}
.src{font-size:10.5px;padding:1px 6px;border-radius:3px;background:var(--sub);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.src.manual{background:var(--accent-soft);color:var(--accent)} .src.none{background:var(--warn-soft);color:var(--warn)}
.report{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:22px clamp(14px,3vw,34px);max-width:1080px}
.report .rh{text-align:center;margin-bottom:16px}
.report .rh .t{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.report .rh .s{font-size:13px;color:var(--muted)}
.report table td,.report table th{border-bottom:none;padding:4px 8px}
.report table tr.tot td{border-top:1px solid var(--rule-strong)}
.report thead th{position:static;background:transparent;border-bottom:1px solid var(--rule-strong)}
.balance-note{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;margin-top:14px}
dialog{border:1px solid var(--rule-strong);border-radius:8px;padding:0;background:var(--sheet);color:var(--ink);width:min(1100px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,15,13,.45)}
dialog .dh{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule)}
dialog .db{padding:12px 16px;overflow:auto;max-height:calc(100vh - 140px)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:6px;font-size:13px;z-index:50;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:min(420px,calc(100vw - 32px))}
.toast.show{opacity:1;transform:none}
.pill-k{font-family:var(--f-num);font-size:11px;padding:1px 5px;border-radius:3px;background:var(--accent-soft);color:var(--accent);margin-right:3px;white-space:nowrap}
.pill-k.neg{background:var(--warn-soft);color:var(--warn)}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--rule-strong);padding:4px 10px;max-width:80ch}
.calc td{padding:6px 8px}
.calc td.n{min-width:150px}
.calc tr.hl td{background:var(--accent-soft);font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted)}
.sumline{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
.sumline b{font-family:var(--f-num);font-weight:500}
@media (max-width:640px){.idrow h1{font-size:19px}.tblwrap{max-height:none}input.num{width:110px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    if(has(/affiliat|related|holding|berelasi/))return'Piutang pihak berelasi';
    if(has(/ledger|a\/r|card|qris|city|piutang usaha|receivable trade/))return'Piutang usaha';

    if(has(/affiliat|holding|owner|berelasi/))return'Utang pihak berelasi';

  if(fs.startsWith('LONG')){ if(has(/bank|loan/))return'Utang bank'; if(has(/benefit|pension|imbalan/))return'Liabilitas imbalan pasca kerja'; return'Utang pihak berelasi';}
  if(fs.startsWith('CAPITAL')){ if(has(/paid up|share|saham|capital stock/))return'Modal saham'; if(has(/surplus|agio|tambahan/))return'Tambahan modal disetor'; if(has(/current year|tahun berjalan/))return'Saldo laba (rugi) tahun berjalan'; if(has(/uang muka|advance/))return'Uang Muka Modal'; return'Saldo laba (rugi) tahun sebelumnya';}

  if(fs.startsWith('COST')) return'Harga Pokok Penjualan';

    if(has(/deprec|amort|penyusutan/))return'Beban penyusutan';
    if(has(/interest.*(earn|deposit)|deposito|jasa giro/))return'Pendapatan bunga';

    if(has(/tax|insurance|pbb|asuransi/))return'Biaya Pajak dan Asuransi';

  if(fs.startsWith('EXPENSE')){
    if(has(/salar|wage|jamsostek|bpjs|thr|bonus|allowance|employee meal|medical|casual|tax paid by|leaf/))return'Beban Gaji';

function mapOf(a){const o=COA[a];if(!o||isStat(o))return{l:'',src:'stat'};

// ================= Perhitungan =================
let R=null; // hasil hitung
function compute(){
  const adjBy={};for(const j of S.adj){if(!j.acct)continue;const x=adjBy[j.acct]||(adjBy[j.acct]={d:0,c:0});x.d+=+j.d||0;x.c+=+j.c||0}
  const accts=[];let unmappedBal=0,unmappedN=0;
  for(const o of COALIST){ if(isStat(o)) continue;
    const g=DATA.gl[o.a], sa=DATA.sa?.[o.a], ns=natSign(o), pl=isPLacct(o);
    let prev=0, srcPrev='';
    if(pl){prev=0}
    else if(S.saMode==='file'&&sa!=null){prev=ns*sa;srcPrev='file'}
    else if(g){prev=ns*g[0];srcPrev='gl'}
    else if(sa!=null){prev=ns*sa;srcPrev='file'}
    const d=g?g[1]:0,c=g?g[2]:0,end=prev+d-c;
    const aj=adjBy[o.a]||{d:0,c:0};const fin=end+aj.d-aj.c;
    const m=mapOf(o.a);
    const active=Math.abs(prev)>.004||d||c||aj.d||aj.c;
    const row={o,a:o.a,prev,d,c,end,ad:aj.d,ac:aj.c,fin,l:m.l,src:m.src,srcPrev,active,glPrevNat:g?g[0]:null,saNat:sa};
    accts.push(row);
    if(!m.l&&(Math.abs(fin)>.5||Math.abs(prev)>.5)){unmappedBal++;}
  }
  const by={};const blank=()=>({prev:0,d:0,c:0,end:0,ad:0,ac:0,fin:0,rows:[]});
  for(const r of accts){const k=r.l||'';const b=by[k]||(by[k]=blank());for(const f of['prev','d','c','end','ad','ac','fin'])b[f]+=r[f];b.rows.push(r)}
  const tot=blank();for(const r of accts)for(const f of['prev','d','c','end','ad','ac','fin'])tot[f]+=r[f];
  // natural value of a line
  const v=(name,f='fin')=>{const b=by[name];if(!b)return 0;return LINE[name].nat==='K'?-b[f]:b[f]};
  // laba rugi
  const unPL=(by['']?.rows||[]).filter(r=>isPLacct(r.o)).reduce((s,r)=>s-r.fin,0);
  const unBS=(by['']?.rows||[]).filter(r=>!isPLacct(r.o)).reduce((s,r)=>s+r.fin,0);
  const unBSp=(by['']?.rows||[]).filter(r=>!isPLacct(r.o)).reduce((s,r)=>s+r.prev,0);
  const lr=lrCalc(n=>v(n),unPL);
  const netPL=-accts.filter(r=>isPLacct(r.o)).reduce((s,r)=>s+r.fin,0);
  R={accts,by,tot,v,lr,netPL,unPL,unBS,unBSp,unmappedBal,
     adjD:S.adj.reduce((s,j)=>s+(+j.d||0),0),adjC:S.adj.reduce((s,j)=>s+(+j.c||0),0)};
  R.nr=nrCalc('fin');R.nrPrev=nrCalc('prev');
  return R;
}
function sumLines(sec,get){return LINES.filter(l=>l[1]===sec).reduce((s,l)=>s+get(l[0]),0)}
function lrCalc(get,unPL){
  const pu=sumLines('PU',get),hpp=sumLines('HPP',get),bdo=sumLines('BDO',get),kotor=pu-hpp-bdo,bu=sumLines('BU',get),usaha=kotor-bu;
  const ll=LINES.filter(l=>l[1]==='LL').reduce((s,l)=>s+(l[2]==='K'?get(l[0]):-get(l[0])),0)+(unPL||0);
  return{pu,hpp,bdo,kotor,bu,usaha,ll,lsp:usaha+ll};
}
function nrCalc(f){
  const g=n=>R.v(n,f);
  const al=sumLines('AL',g), atl=sumLines('ATL',g)+(f==='fin'?R.unBS:R.unBSp);
  const ljpd=sumLines('LJPD',g), ljpj=sumLines('LJPJ',g);
  const lrNow = f==='fin'?R.netPL:0;
  const ekMapped=sumLines('EK',g);
  const ek=ekMapped+lrNow;
  return{al,atl,aset:al+atl,ljpd,ljpj,liab:ljpd+ljpj,ek,lrNow,pasiva:ljpd+ljpj+ek,diff:(al+atl)-(ljpd+ljpj+ek)};
}

// ================= Koreksi fiskal =================
function fiskal(){
  const kom=n=>R.v(n);const pos={},neg={},codes={};
  for(const k of S.kor){if(!LINE[k.line])continue;const t=k.jenis==='+'?pos:neg;t[k.line]=(t[k.line]||0)+(+k.amt||0);(codes[k.line]=codes[k.line]||new Set()).add(k.kode)}
  const fis=n=>{const ln=LINE[n],p=pos[n]||0,q=neg[n]||0;return ln.nat==='K'?kom(n)+p-q:kom(n)-p+q};
  const sp=Object.values(pos).reduce((a,b)=>a+b,0),sn=Object.values(neg).reduce((a,b)=>a+b,0);
  const lrK=R.lr, lrF=lrCalc(fis,R.unPL);
  const neto=lrK.lsp+sp-sn;
  const t=S.tax;const omzet=(t.omzet!=null&&t.omzet!=='')?+t.omzet:lrK.pu;
  const k7=typeof l7Komp==='function'?l7Komp(neto):null;const komp=Math.min(Math.max(0,k7!=null?k7:(+t.komp||0)),Math.max(0,neto));
  const pkp=Math.max(0,Math.floor((neto-komp)/1000)*1000);
  let fas=0;if(t.use31e&&omzet>0&&omzet<=50e9){fas=omzet<=4.8e9?pkp:Math.floor(4.8e9/omzet*pkp)}
  const pph=Math.floor(fas*0.11+(pkp-fas)*0.22);
  const kredit=(+t.p22||0)+(+t.p23||0)+(+t.p24||0);const p25=+t.p25||0;const p29=pph-kredit-p25;
  return{kom,pos,neg,codes,fis,sp,sn,lrK,lrF,neto,omzet,komp,pkp,fas,pph,kredit,p25,p29,neto_check:lrF.lsp};
}

  $('#f-json').onchange=e=>importProject(e.target.files[0]);
  $('#f-sig').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>600000){toast('Gambar terlalu besar (maks. 600 KB)');return}const fr=new FileReader();fr.onload=()=>{try{localStorage.setItem('kkspt.sig',fr.result);toast('Gambar tanda tangan disimpan')}catch(err){toast('Gagal menyimpan gambar di browser')}render('data')};fr.readAsDataURL(f)};
  if($('#b-sigdel'))$('#b-sigdel').onclick=()=>{try{localStorage.removeItem('kkspt.sig')}catch(e){}render('data')};

  $('#b-newpt').onclick=()=>$('#newpt-confirm').hidden=false;$('#b-newpt-no').onclick=()=>$('#newpt-confirm').hidden=true;
  $('#b-newpt-yes').onclick=clearAll;
  $('#close-acct').onchange=e=>{S.closeAcct=e.target.value;save()};
  if(!S.closeAcct){const f=COALIST.find(o=>mapOf(o.a).l==='Saldo laba (rugi) tahun berjalan');if(f)S.closeAcct=f.a}
}

  if(!inc&&/\b(rent|rental|sewa|lease)\b/.test(d)&&!out.some(x=>x.k==='42'||x.k==='23'))out.push({k:'42',t:'Sewa: bila tanah/bangunan PPh 4(2) final 10%; bila harta lain (kendaraan/peralatan) PPh 23 2%. Pastikan objeknya.'});
  return TPC[ck]=out}
function tpBadges(o,full){const t=taxPot(o);if(!t.length)return'';return`<span class="tpw">${t.map(x=>`<span class="tp tp${x.k}" title="${esc(x.t)}">${TP_NAME[x.k]}</span>`).join('')}</span>`+(full?`<div class="tpk">${t.map(x=>`<span><b class="tpt${x.k}">${TP_NAME[x.k]}</b> ${esc(x.t)}</span>`).join('')}</div>`:'')}

  if(fmt==='csv'){const q=x=>/[",;\n]/.test(String(x))?'"'+String(x).replace(/"/g,'""')+'"':String(x);

  out.push(ut?['Saldo awal GL',r2(x.open),'Saldo menurut data',r2(x.dataEnd),'Saldo GL',r2(x.end),'Selisih',r2(x.diff)]:['Saldo awal GL',r2(x.open),'Kredit pajak',r2(x.kredit),'Saldo GL',r2(x.end),'Selisih',r2(x.diff)]);
  {const M=rkMatch(k);if(M){out.push(['Belum berpasangan (rincian saldo/selisih)']);for(const i of M.unSrc)out.push(['PPh/diakui',i.date,i.ref,i.desc,r2(i.amt)]);for(const i of M.unPay)out.push(['Setor/kompensasi',i.date,i.ref,i.desc,r2(-i.amt)]);out.push(['Bersih','','','',r2(M.sSrc-M.sPay)])}}
  if(x.T.eq)out.push(['Ekualisasi: pos L/R',x.c.eq.join(' + '),r2(x.eqBase),'DPP data',r2(x.sDpp),'Selisih',r2(x.eqDiff),'Indikasi '+x.c.rate+'%',r2(x.eqInd)]);

// ================= 9. ASET & LAMPIRAN 9 =================
const L9REF=JSON.parse($('#l9ref').textContent);
const L9_DEP_CODES=['0401','0402','0403','0404','0405','0406','0407','0408','0409','0410','0411','0412','0413','0499','0707','0708','0709','0710','0711','0799','0502','0503','0504','0505','0599'];
const L9_AM_CODES=['0601','0602','0603','0604','0605','0606','0607','0608','0609','0610','0699'];
const L9_BLDG=['0502','0503','0504','0505','0599'];
const L9_GROUPS_DEP=['Group 1','Group 2','Group 3','Group 4','Other Group','Permanent','Non-permanent'];
const L9_GROUPS_AM=['Group 1','Group 2','Group 3','Group 4','Other Group'];
const L9_METK=['GL','JAT','JJJ','JSP','ML','SM','SMG'];
const L9_METF=['GL','JSP','SM'];
const L9_LIFE={'Group 1':4,'Group 2':8,'Group 3':16,'Group 4':20,'Permanent':20,'Non-permanent':10};
const codeName=c=>{const t=(L9REF.Ref||[]).concat(L9REF.RefAmortization||[]).find(r=>String(r[0]).trim()===c);return t?String(t[2]||t[1]||'').trim():''};
function asetState(){S.aset=S.aset||{rows:[],conv:'acq'};return S.aset}
// akun COA aset → kode & kelompok bawaan
function l9Guess(desc){const d=desc.toLowerCase();
  if(/land|tanah/.test(d))return['0799','Other Group'];
  if(/building|bangunan|infra/.test(d))return['0503','Permanent'];
  if(/vehicle|automobile|mobil|car/.test(d))return['0403','Group 2'];
  if(/computer|hardware|office|printer|laptop/.test(d))return['0710','Group 1'];
  if(/audio|video|electronic|tv/.test(d))return['0708','Group 1'];
  if(/furniture|fixture|linen|room equip|banquet/.test(d))return['0709','Group 1'];
  if(/kitchen|equipment|sport/.test(d))return['0413','Group 1'];
  if(/machin|genset|lift|elevator|laundry|ac |refriger|install/.test(d))return['0410','Group 1'];
  if(/software|license|lisensi/.test(d))return['0699','Group 1'];
  return['0799','Group 1']}
// penyusutan fiskal: kembalikan {sisa: nilai sisa buku fiskal awal tahun Y, fis: penyusutan tahun Y, akhir}
function l9Calc(r,Y){const cost=+r.harga||0,m=+r.bln,y=+r.thn;
  const life=r.kel==='Other Group'?(+r.life||0):L9_LIFE[r.kel];
  if(!cost||!(m>=1&&m<=12)||!(y>1900)||!life) return{sisa:cost,fis:0,akhir:cost,life:life||0,nondep:!life};
  const s=y*12+(m-1)+(asetState().conv==='next'?1:0), n=life*12, e=s+n-1, y0=Y*12, y1=Y*12+11;
  if(y>Y) return{sisa:0,fis:0,akhir:0,life,future:true};
  const ov=(a,b)=>Math.max(0,Math.min(b,e)-Math.max(a,s)+1);
  if(r.metF==='SM'){const rate=2/life;let bv=cost,sisa=cost,fis=0;
    for(let yy=Math.floor(s/12);yy<=Y;yy++){const mo=ov(yy*12,yy*12+11);let d=0;
      if(mo>0){const last=e<=yy*12+11; d=last?bv:bv*rate*mo/12}
      if(yy===Y){sisa=bv;fis=d}bv-=d}
    return{sisa,fis,akhir:sisa-fis,life}}
  const mth=cost/n;const before=ov(-1e9,y0-1),inY=ov(y0,y1);
  const sisa=cost-mth*before;const fis=Math.min(sisa,mth*inY);return{sisa,fis,akhir:sisa-fis,life}}
function l9Issues(r){const out=[],dep=r.jenis!=='amor';const codes=dep?L9_DEP_CODES:L9_AM_CODES;
  if(!codes.includes(String(r.kode)))out.push('Kode aset tidak ada di referensi');
  if(!(dep?L9_GROUPS_DEP:L9_GROUPS_AM).includes(r.kel))out.push('Kelompok tidak valid');
  if(dep&&L9_BLDG.includes(String(r.kode))&&!['Permanent','Non-permanent'].includes(r.kel))out.push('Kode bangunan wajib kelompok Permanent/Non-permanent');
  if(dep&&['Permanent','Non-permanent'].includes(r.kel)&&r.metF!=='GL')out.push('Bangunan wajib metode fiskal GL');
  if(!(+r.bln>=1&&+r.bln<=12))out.push('Bulan 1–12');
  if(!/^\d{4}$/.test(String(r.thn))||+r.thn>+S.settings.tahun)out.push('Tahun 4 digit, ≤ tahun pajak');
  if(!(+r.harga>0))out.push('Harga perolehan harus positif');
  if(!L9_METK.includes(r.metK))out.push('Metode komersial tidak valid');
  if(!L9_METF.includes(r.metF))out.push('Metode fiskal tidak valid');
  if(r.metF==='SM'&&!['Group 1','Group 2','Group 3','Group 4'].includes(r.kel))out.push('Saldo menurun hanya untuk Kelompok 1–4');
  if(r.kel==='Other Group'&&String(r.kode)!=='0799'&&!(+r.life>0))out.push('Isi masa manfaat untuk Kelompok Lainnya');
  return out}

function l9Summary(){const rows=l9Rows();const fis=rows.reduce((s,x)=>s+(x.c.future?0:x.c.fis),0);
  const kom=R.v('Beban penyusutan');const byAcct={};

  for(const a in byAcct){if(a&&!fa.some(f=>f.a===a))fa.push({a,desc:COA[a]?.desc||'(akun tidak ada di COA)',tb:0,reg:byAcct[a]})}
  return{rows,fis,kom,diff:kom-fis,fa,unacct:byAcct['']||0,errs:rows.filter(x=>x.iss.length).length}}

async function l9Import(file){if(!file)return;try{
  if(typeof XLSX==='undefined')throw new Error('pustaka Excel belum termuat');
  const wb=XLSX.read(await readBuf(file));const ws=wb.Sheets['DATA']||wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});let mode=null,hdr=false;const out=[];
  for(const r of rows){const a=String(r[0]??'').trim();

function lpState(){S.lamp=S.lamp||{};const L=S.lamp;L.l4=L.l4||null;L.l7=L.l7||[];if(L.useL7==null)L.useL7=true;L.der=L.der||{};return L}
const MONTHS_N=()=>{const p=DATA.meta?.period;let m=p?+p[1].slice(3,5):12;return Math.max(1,Math.min(12,m||12))};
function monthEnds(r){const m=DATA.glm?.[r.a];const out=[];let b=r.prev;for(let i=0;i<MONTHS_N();i++){if(m)b+=m[i*2]-m[i*2+1];out.push(b)}return out}
// ---- L11B ----
function derDefaults(){const L=lpState();if(!L.der.debt)L.der.debt=R.accts.filter(r=>!isPLacct(r.o)&&['Utang bank','Utang pihak berelasi'].includes(r.l)&&r.active).map(r=>r.a);
  if(!L.der.cost)L.der.cost=R.accts.filter(r=>isPLacct(r.o)&&r.l==='Beban keuangan'&&/interest|bunga|loan|pinjaman|provisi/i.test(r.o.desc)&&r.active).map(r=>r.a);return L.der}
function derCalc(){const D=derDefaults();const n=MONTHS_N();
  const debtRows=R.accts.filter(r=>D.debt.includes(r.a));const debtM=Array(n).fill(0);debtRows.forEach(r=>monthEnds(r).forEach((b,i)=>debtM[i]+=-b));
  const eqRows=R.accts.filter(r=>!isPLacct(r.o)&&r.l&&LINE[r.l].sec==='EK');const plRows=R.accts.filter(r=>isPLacct(r.o));const eqM=Array(n).fill(0);
  eqRows.forEach(r=>monthEnds(r).forEach((b,i)=>eqM[i]+=-b));plRows.forEach(r=>monthEnds(r).forEach((b,i)=>eqM[i]+=-b));
  const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;const utang=avg(debtM),modal=avg(eqM);
  const cost=R.accts.filter(r=>D.cost.includes(r.a)).reduce((a,r)=>a+r.fin,0);
  let ded=cost,der=modal>0?utang/modal:Infinity,why='';
  if(modal<=0){ded=0;why='Modal rata-rata nol/negatif: seluruh biaya pinjaman tidak dapat dibebankan.'}
  else if(der>4){ded=cost*(4*modal)/utang;why='DER melebihi 4:1: biaya pinjaman dibebankan secara proporsional.'}
  const lsp=R.lr.lsp;const dep=R.v('Beban penyusutan');const ebitda=lsp+dep+cost;
  return{debtM,eqM,utang,modal,der,cost,ded,nond:cost-ded,why,ebitda,lsp,dep,n,debtRows}}

function l7Calc(F){const L=lpState(),Y=+S.settings.tahun;let avail=Math.max(0,F.neto);const rows=L.l7.slice().sort((a,b)=>(+a.tahun)-(+b.tahun)).map(r=>{const sisa=Math.max(0,(+r.rugi||0)-(+r.sudah||0));const ok=+r.tahun>=Y-5&&+r.tahun<Y;const pakai=ok?Math.min(avail,sisa):0;avail-=pakai;return{...r,sisa,ok,pakai,akhir:ok?sisa-pakai:0}});
  const tot=rows.reduce((a,r)=>a+r.pakai,0);return{rows,tot,rugiIni:F.neto<0?-F.neto:0}}

function l4Suggest(){const out=[];for(const r of R.accts){if(!isPLacct(r.o)||Math.abs(r.fin)<0.5)continue;const d=r.o.desc;const inc=-r.fin;if(inc<=0)continue;

  return out}

  return c}
